name: Publicar Better xCloud Web Lab
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: better-xcloud-web-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener contenido
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar carpeta pública
        run: |
          mkdir -p public/web
          cp -R web/. public/web/
          printf '%s\n' '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./web/"><title>Better xCloud Web Lab</title></head><body><a href="./web/">Abrir Better xCloud Web Lab</a></body></html>' > public/index.html
          touch public/.nojekyll
      - name: Subir sitio estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4