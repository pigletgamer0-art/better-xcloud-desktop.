name: Build Better xCloud Mobile Enhanced v0.2 Injection Fix

on:
  push:
    branches: [mobile-enhanced-v0.2-injection-fix]
    paths:
      - '.github/workflows/build-mobile-enhanced-v02.yml'
      - 'mobile-enhanced/mobile-enhanced-v02.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Mobile Enhanced overlay
        shell: bash
        run: |
          set -euo pipefail
          node --check mobile-enhanced/mobile-enhanced-v02.js
          grep -q "const VERSION = '0.2.0'" mobile-enhanced/mobile-enhanced-v02.js
          grep -q 'BX_MOBILE_ENHANCED' mobile-enhanced/mobile-enhanced-v02.js
          grep -q 'waitForHost' mobile-enhanced/mobile-enhanced-v02.js

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;35.0.0' 'platform-tools'

      - name: Download official Better xCloud Android 0.24.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o base.apk 'https://github.com/redphx/better-xcloud-android/releases/download/a0.24.2/com.redphx.betterxc_0.24.2-39.apk'
          EXPECTED='758d957f4709253956f39b214a59866045081a8c79574133d76628d972a459d3'
          ACTUAL="$(sha256sum base.apk | awk '{print $1}')"
          echo "Base SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Download apktool
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o apktool.jar 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar'
          java -jar apktool.jar --version

      - name: Decode APK and preserve official Android bootstrap
        shell: bash
        run: |
          set -euo pipefail
          java -jar apktool.jar d -f base.apk -o decoded
          ADD='decoded/assets/userscripts/additional.user.js'
          test -f "$ADD"
          grep -Fq '[[BX_FLAGS]]' "$ADD"
          grep -Fq '[[REMAP_BACK_BUTTON]]' "$ADD"
          grep -q 'BackButtonRemap.setup' "$ADD"
          cp "$ADD" official-additional.user.js
          sha256sum official-additional.user.js | awk '{print $1}' > official-additional.sha
          echo "Official bootstrap SHA-256: $(cat official-additional.sha)"

      - name: Append guarded Mobile Enhanced overlay after official bootstrap
        shell: bash
        run: |
          set -euo pipefail
          ADD='decoded/assets/userscripts/additional.user.js'
          OFFICIAL_BYTES="$(wc -c < official-additional.user.js)"
          {
            cat official-additional.user.js
            printf '\n\n/* === Better xCloud Mobile Enhanced v0.2 injection fix === */\n'
            cat mobile-enhanced/mobile-enhanced-v02.js
            printf '\n/* === end Mobile Enhanced v0.2 === */\n'
          } > "$ADD"

          # Keep the exact official file as the prefix so the Android template engine
          # can still replace BX_FLAGS and REMAP_BACK_BUTTON before executing our code.
          head -c "$OFFICIAL_BYTES" "$ADD" > prefix.bin
          cmp -s official-additional.user.js prefix.bin
          grep -Fq '[[BX_FLAGS]]' "$ADD"
          grep -Fq '[[REMAP_BACK_BUTTON]]' "$ADD"
          grep -q 'BackButtonRemap.setup' "$ADD"
          grep -q 'Better xCloud Mobile Enhanced v0.2 injection fix' "$ADD"
          grep -q 'BX_MOBILE_ENHANCED' "$ADD"
          grep -q 'waitForHost' "$ADD"
          echo "Official Android bootstrap preserved as ${OFFICIAL_BYTES}-byte prefix"

          sed -i 's/android:versionName="0.24.2"/android:versionName="0.24.2-ME0.2"/' decoded/AndroidManifest.xml || true
          if [ -f decoded/res/values/strings.xml ]; then
            sed -i 's#<string name="app_name">Better xCloud</string>#<string name="app_name">Better xCloud Enhanced</string>#' decoded/res/values/strings.xml || true
          fi

      - name: Rebuild APK
        shell: bash
        run: |
          set -euo pipefail
          java -jar apktool.jar b decoded -o unsigned.apk
          test -s unsigned.apk
          file unsigned.apk

      - name: Generate signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore mobile-enhanced.jks \
            -storepass android \
            -alias mobileenhanced \
            -keypass android \
            -dname 'CN=Better xCloud Mobile Enhanced v0.2, O=Community Build, C=CL' \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Align and sign APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 unsigned.apk aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks mobile-enhanced.jks \
            --ks-key-alias mobileenhanced \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out Better-xCloud-Mobile-Enhanced-v0.2-InjectionFix.apk \
            aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Better-xCloud-Mobile-Enhanced-v0.2-InjectionFix.apk | tee signature-verification.txt
          "$BUILD_TOOLS/zipalign" -c -v 4 Better-xCloud-Mobile-Enhanced-v0.2-InjectionFix.apk | tail -n 8

      - name: Verify final APK contains both official bootstrap and overlay
        shell: bash
        run: |
          set -euo pipefail
          java -jar apktool.jar d -f Better-xCloud-Mobile-Enhanced-v0.2-InjectionFix.apk -o verify-decoded >/dev/null
          FINAL='verify-decoded/assets/userscripts/additional.user.js'
          test -f "$FINAL"
          grep -Fq '[[BX_FLAGS]]' "$FINAL"
          grep -Fq '[[REMAP_BACK_BUTTON]]' "$FINAL"
          grep -q 'BackButtonRemap.setup' "$FINAL"
          grep -q 'Better xCloud Mobile Enhanced v0.2 injection fix' "$FINAL"
          grep -q 'BX_MOBILE_ENHANCED' "$FINAL"
          grep -q "const VERSION = '0.2.0'" "$FINAL"
          grep -q 'waitForHost' "$FINAL"

          OFFICIAL_BYTES="$(wc -c < official-additional.user.js)"
          head -c "$OFFICIAL_BYTES" "$FINAL" > final-prefix.bin
          cmp -s official-additional.user.js final-prefix.bin

          sha256sum Better-xCloud-Mobile-Enhanced-v0.2-InjectionFix.apk > Better-xCloud-Mobile-Enhanced-v0.2-InjectionFix.sha256.txt
          {
            echo 'Better xCloud Mobile Enhanced v0.2 - Injection Fix'
            echo 'Base: official Better xCloud Android 0.24.2-39'
            echo 'Injection path: assets/userscripts/additional.user.js, the extension point read by UserscriptUtil.'
            echo 'Fix: official bootstrap remains byte-for-byte at the start; Mobile Enhanced is appended after it.'
            echo 'Overlay waits for BX_EXPOSED before initializing and has a last-resort BX+ UI path.'
            echo 'Features: Native Look, Controller Console, Stream Health, touch menu, Alt+F11.'
            echo 'Community-signed test build; signature differs from official APK.'
          } > Better-xCloud-Mobile-Enhanced-v0.2-InjectionFix-BUILD.txt
          cat Better-xCloud-Mobile-Enhanced-v0.2-InjectionFix.sha256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Better-xCloud-Mobile-Enhanced-v0.2-InjectionFix
          path: |
            Better-xCloud-Mobile-Enhanced-v0.2-InjectionFix.apk
            Better-xCloud-Mobile-Enhanced-v0.2-InjectionFix.sha256.txt
            Better-xCloud-Mobile-Enhanced-v0.2-InjectionFix-BUILD.txt
            signature-verification.txt
            official-additional.user.js
            decoded/assets/userscripts/additional.user.js
            mobile-enhanced/mobile-enhanced-v02.js
          if-no-files-found: error
          compression-level: 0
