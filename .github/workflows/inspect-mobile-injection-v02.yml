name: Inspect Better xCloud Android Injection Path v0.2

on:
  push:
    branches: [mobile-enhanced-v0.2-injection-fix]
    paths:
      - '.github/workflows/inspect-mobile-injection-v02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and decode official APK
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o base.apk 'https://github.com/redphx/better-xcloud-android/releases/download/a0.24.2/com.redphx.betterxc_0.24.2-39.apk'
          curl -L --fail --retry 3 -o apktool.jar 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar'
          java -jar apktool.jar d -f base.apk -o decoded >/dev/null
      - name: Show exact injection path
        shell: bash
        run: |
          set +e
          MAIN='decoded/smali/com/redphx/betterxcloud/MainActivity.smali'
          WEB='decoded/smali/com/redphx/betterxcloud/WebViewActivity.smali'
          echo '===== OFFICIAL ADDITIONAL ASSET ====='
          nl -ba decoded/assets/userscripts/additional.user.js
          echo '===== MAINACTIVITY 80-220 ====='
          nl -ba "$MAIN" | sed -n '80,220p'
          echo '===== MAINACTIVITY setAdditionalPostloadJS refs ====='
          grep -n -C 35 -E 'setAdditionalPostloadJS|additionalPostloadJS|additional\.user\.js|userscripts|AssetManager;->open|getAssets' "$MAIN"
          echo '===== WEBVIEWACTIVITY 500-760 ====='
          nl -ba "$WEB" | sed -n '500,760p'
          echo '===== WEBVIEWACTIVITY POSTLOAD 2120-2380 ====='
          nl -ba "$WEB" | sed -n '2120,2380p'
          echo '===== WEBVIEWACTIVITY FIELD/ACCESSOR REFS ====='
          grep -n -C 30 -E 'additionalPostloadJS|setAdditionalPostloadJS|getAdditionalPostloadJS|postload\(' "$WEB"
          echo '===== ALL setAdditionalPostloadJS refs ====='
          grep -RIn -C 30 'setAdditionalPostloadJS' decoded/smali decoded/smali_classes2 2>/dev/null
          echo '===== ALL additionalPostloadJS refs ====='
          grep -RIn -C 25 'additionalPostloadJS' decoded/smali decoded/smali_classes2 2>/dev/null
          echo '===== ALL ASSET OPEN / USERSCRIPTS refs ====='
          grep -RIn -C 20 -E 'additional\.user\.js|userscripts|AssetManager;->open|getAssets\(\)' decoded/smali decoded/smali_classes2 2>/dev/null | head -n 1600
          exit 0
