name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Reconstruct source package
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'source-package/part-*.b64' | Sort-Object Name
          if ($parts.Count -ne 8) {
            throw "Expected 8 source package parts, found $($parts.Count)."
          }
          $base64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('repo-source-min.zip', [Convert]::FromBase64String($base64))
          Expand-Archive 'repo-source-min.zip' -DestinationPath 'build' -Force

      - name: Download pinned Better xCloud 6.7.12
        shell: pwsh
        run: |
          $url = 'https://github.com/redphx/better-xcloud/releases/download/v6.7.12/better-xcloud.user.js'
          $out = 'build/repo_src/app/scripts/better-xcloud.user.js'
          Invoke-WebRequest $url -OutFile $out
          $actual = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'bb78931b4ec94d68cb18da97fa4ae1f88e6b3103bc159905931b2238a51b517e'
          if ($actual -ne $expected) {
            throw "Better xCloud SHA-256 mismatch. Expected $expected, got $actual"
          }

      - name: Prepare embedded application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'build/repo_src/installer/embedded' | Out-Null
          Copy-Item 'build/repo_src/app' 'build/repo_src/installer/embedded/app' -Recurse -Force

      - name: Build installer
        shell: pwsh
        working-directory: build/repo_src/installer
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'BetterXcloud-Desktop-Setup-v2.6.exe' .

      - name: Generate SHA-256
        shell: pwsh
        working-directory: build/repo_src/installer
        run: |
          $hash = (Get-FileHash 'BetterXcloud-Desktop-Setup-v2.6.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BetterXcloud-Desktop-Setup-v2.6.exe" | Set-Content 'BetterXcloud-Desktop-Setup-v2.6.sha256.txt' -NoNewline
          Write-Host "SHA-256: $hash"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterXcloud-Desktop-Setup-v2.6
          path: |
            build/repo_src/installer/BetterXcloud-Desktop-Setup-v2.6.exe
            build/repo_src/installer/BetterXcloud-Desktop-Setup-v2.6.sha256.txt
          if-no-files-found: error
          compression-level: 0
