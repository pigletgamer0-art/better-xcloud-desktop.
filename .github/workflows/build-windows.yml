name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # The repository name currently ends in a dot. Windows runners cannot
    # create that checkout directory, so we cross-compile the Windows EXE
    # from Ubuntu instead.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false

      - name: Reconstruct source package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          parts = sorted(Path('source-package').glob('part-*.b64'))
          if len(parts) != 8:
              raise SystemExit(f'Expected 8 source package parts, found {len(parts)}')

          encoded = ''.join(p.read_text(encoding='utf-8') for p in parts)
          blob = base64.b64decode(encoded, validate=True)
          expected = 'cb526df0b52c22b395637ce1f1d686668835d484bfd64933db319221166f734b'
          actual = hashlib.sha256(blob).hexdigest()
          if actual != expected:
              raise SystemExit(f'Source package SHA-256 mismatch: {actual}')

          Path('repo-source-min.zip').write_bytes(blob)
          print(f'Source package verified: {actual}')
          PY
          mkdir -p build
          unzip -q repo-source-min.zip -d build

      - name: Remove trial Ultra Assistant
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('build/repo_src')

          addon = root / 'app/scripts/ultra-assistant.user.js'
          if addon.exists():
              addon.unlink()

          preload = root / 'app/preload.js'
          text = preload.read_text(encoding='utf-8')
          text = text.replace(
              '  // IMPORTANT: Better xCloud and Ultra Assistant use separate try/catch blocks.\n'
              '  // One failing must never prevent the other from being installed.\n',
              ''
          )
          start = text.find("\n  try {\n    const ultra = readScript('ultra-assistant.user.js');")
          if start != -1:
              end = text.find("\n  }\n", start)
              if end == -1:
                  raise SystemExit('Could not remove Ultra Assistant preload block')
              text = text[:start] + '\n' + text[end + len("\n  }\n"):]
          preload.write_text(text, encoding='utf-8')

          main = root / 'app/main.js'
          text = main.read_text(encoding='utf-8')
          text = text.replace(
              ",\n        ultraAssistant: !!document.getElementById('bx-ultra-assistant-addon-style') || !!document.getElementById('bx-ultra-assistant-fallback-button')",
              ''
          )
          main.write_text(text, encoding='utf-8')

          package = root / 'app/package.json'
          package.write_text(
              package.read_text(encoding='utf-8').replace(
                  'Better xCloud Desktop with integrated Ultra Assistant',
                  'Better xCloud Desktop'
              ),
              encoding='utf-8'
          )

          notice = root / 'NOTICE.txt'
          text = notice.read_text(encoding='utf-8')
          text = text.replace(
              '\nUltra Assistant Add-on 2.0.0 fue incluido desde el archivo proporcionado por el usuario para esta compilación.\n',
              '\n'
          )
          notice.write_text(text.rstrip() + '\n', encoding='utf-8')

          installer = root / 'installer/main.go'
          text = installer.read_text(encoding='utf-8')
          text = text.replace('Better xCloud Desktop con Ultra Assistant integrado', 'Better xCloud Desktop')
          text = text.replace(
              'los ajustes de Better xCloud, Ultra Assistant y los registros',
              'los ajustes de Better xCloud y los registros'
          )
          installer.write_text(text, encoding='utf-8')

          forbidden = re.compile(r'Ultra Assistant|ultra-assistant|Alt\s*\+\s*F9', re.I)
          hits = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              try:
                  data = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if forbidden.search(data):
                  hits.append(str(path))
          if hits:
              raise SystemExit('Ultra Assistant references remain: ' + ', '.join(hits))
          PY

      - name: Download pinned Better xCloud 6.7.12
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/redphx/better-xcloud/releases/download/v6.7.12/better-xcloud.user.js'
          out='build/repo_src/app/scripts/better-xcloud.user.js'
          curl -fL "$url" -o "$out"
          echo 'bb78931b4ec94d68cb18da97fa4ae1f88e6b3103bc159905931b2238a51b517e  build/repo_src/app/scripts/better-xcloud.user.js' | sha256sum -c -

      - name: Prepare embedded application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/repo_src/installer/embedded
          cp -R build/repo_src/app build/repo_src/installer/embedded/app

      - name: Build Windows installer
        shell: bash
        working-directory: build/repo_src/installer
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o BetterXcloud-Desktop-Setup-v2.6.exe .
          sha256sum BetterXcloud-Desktop-Setup-v2.6.exe > BetterXcloud-Desktop-Setup-v2.6.sha256.txt
          cat BetterXcloud-Desktop-Setup-v2.6.sha256.txt

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterXcloud-Desktop-Setup-v2.6
          path: |
            build/repo_src/installer/BetterXcloud-Desktop-Setup-v2.6.exe
            build/repo_src/installer/BetterXcloud-Desktop-Setup-v2.6.sha256.txt
          if-no-files-found: error
          compression-level: 0

      - name: Replace v2.6.0 release without Ultra Assistant
        if: github.event_name == 'push' && github.event.head_commit.message == 'Remove Ultra Assistant'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exe='build/repo_src/installer/BetterXcloud-Desktop-Setup-v2.6.exe'
          sums='build/repo_src/installer/BetterXcloud-Desktop-Setup-v2.6.sha256.txt'
          gh release upload v2.6.0 "$exe" "$sums" --clobber
          gh release edit v2.6.0 \
            --title 'Better xCloud Desktop v2.6.0' \
            --notes $'Stable installer release.\n\n- Independent desktop app; does not launch Microsoft Edge.\n- Includes Better xCloud 6.7.12 (MIT).\n- Uses Electron 44.3.0 / Chromium as its private runtime.\n- Registers in Windows Installed Apps and includes an uninstaller.\n- Preserves Xbox session and Better xCloud settings when updating.\n- Includes SHA-256 checksum for the installer.\n\nThis is an unofficial community desktop wrapper and is not affiliated with Microsoft, Xbox, or the Better xCloud project.'
