name: Inspect Better xCloud Android APK

on:
  push:
    branches: [mobile-enhanced-build]
    paths: ['.github/workflows/inspect-mobile-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official APK
        run: |
          curl -L --fail -o app.apk 'https://github.com/redphx/better-xcloud-android/releases/download/a0.24.2/com.redphx.betterxc_0.24.2-39.apk'
          sha256sum app.apk
      - name: Basic tree
        run: |
          unzip -l app.apk | sed -n '1,220p'
      - name: Dex strings
        run: |
          unzip -q app.apk 'classes*.dex' -d dex
          for f in dex/classes*.dex; do
            echo "===== $f ====="
            strings "$f" | grep -Ei 'userscript|custom.?script|javascript|evaluateJavascript|better.?xcloud|webview|gamepad|controller|localStorage|sharedpref|asset' | head -n 400 || true
          done
      - name: Manifest via apkanalyzer
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'cmdline-tools;latest' >/dev/null || true
          find "$ANDROID_HOME" -type f -name apkanalyzer -print -quit | xargs -r -I{} {} manifest print app.apk | head -n 500 || true
