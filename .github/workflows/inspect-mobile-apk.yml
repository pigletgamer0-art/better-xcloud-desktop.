name: Inspect Better xCloud Android APK

on:
  push:
    branches: [mobile-enhanced-v0.1]
    paths:
      - '.github/workflows/inspect-mobile-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download and decode official APK
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o base.apk 'https://github.com/redphx/better-xcloud-android/releases/download/a0.24.2/com.redphx.betterxc_0.24.2-39.apk'
          curl -L --fail --retry 3 -o apktool.jar 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar'
          java -jar apktool.jar d -f base.apk -o decoded

      - name: Focused inspection
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== BUNDLED SCRIPT TYPE/SIZE ==='
            file decoded/assets/bundled.script
            wc -c -l decoded/assets/bundled.script
            sha256sum decoded/assets/bundled.script
            echo
            echo '=== BUNDLED SCRIPT HEAD ==='
            head -c 12000 decoded/assets/bundled.script || true
            echo
            echo
            echo '=== BUNDLED SCRIPT TAIL ==='
            tail -c 12000 decoded/assets/bundled.script || true
            echo
            echo
            echo '=== BUNDLED SCRIPT INTERESTING TOKENS ==='
            grep -aoniE 'BetterXcloud.Stream|controller.settings|video.processing|stream.video.resolution|stream.video.maxBitrate|customizationPresetId|ControllerCustomizations|StreamSettings|STORAGE|localStorage|gamepadconnected|navigator.getGamepads' decoded/assets/bundled.script | head -n 500 || true
            echo
            echo '=== ASSET LOADER REFERENCES ==='
            grep -RniE 'bundled\.script|getAssets|AssetManager|evaluateJavascript|evaluate_javascript|javascript:|loadUrl|load_url|addJavascriptInterface|WebView|webview' decoded/smali*/com/redphx/better_xcloud 2>/dev/null | head -n 1200 || true
            echo
            echo '=== MAIN ACTIVITY METHODS ==='
            grep -nE '^\.method|bundled\.script|WebView|evaluate|script|asset' decoded/smali*/com/redphx/better_xcloud/MainActivity*.smali 2>/dev/null | head -n 1000 || true
          } | tee focused-inspection.txt

      - name: Upload focused inspection
        uses: actions/upload-artifact@v4
        with:
          name: better-xcloud-mobile-focused-inspection
          path: focused-inspection.txt
          if-no-files-found: error
