name: Inspect Better xCloud Android APK

on:
  push:
    branches: [mobile-enhanced-v0.1]
    paths:
      - '.github/workflows/inspect-mobile-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download official Better xCloud Android 0.24.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o base.apk 'https://github.com/redphx/better-xcloud-android/releases/download/a0.24.2/com.redphx.betterxc_0.24.2-39.apk'
          sha256sum base.apk | tee base.sha256
          file base.apk

      - name: Install apktool
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o apktool.jar 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar'
          java -jar apktool.jar --version

      - name: Decode APK
        shell: bash
        run: |
          set -euo pipefail
          java -jar apktool.jar d -f base.apk -o decoded

      - name: Build inspection report
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== BASE APK ==='
            cat base.sha256
            echo
            echo '=== TOP LEVEL ==='
            find decoded -maxdepth 2 -type f | sort | head -n 300
            echo
            echo '=== ASSETS / RAW ==='
            find decoded/assets decoded/res/raw -type f 2>/dev/null | sort || true
            echo
            echo '=== SCRIPT / USERSCRIPT / WEBVIEW REFERENCES ==='
            grep -RniE 'userscript|better.?xcloud|webview|javascript:|evaluateJavascript|scriptUrl|script_url|custom script|custom userscript' decoded 2>/dev/null | head -n 1200 || true
            echo
            echo '=== JS/CSS/HTML FILES ==='
            find decoded -type f \( -iname '*.js' -o -iname '*.css' -o -iname '*.html' \) -print | sort || true
            echo
            echo '=== MANIFEST ==='
            sed -n '1,260p' decoded/AndroidManifest.xml || true
          } > inspection.txt
          wc -l inspection.txt

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: better-xcloud-mobile-inspection
          path: |
            inspection.txt
            base.sha256
          if-no-files-found: error
