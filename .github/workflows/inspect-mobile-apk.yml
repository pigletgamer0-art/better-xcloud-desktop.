name: Inspect Better xCloud Android APK

on:
  push:
    branches: [mobile-enhanced-v0.1]
    paths:
      - '.github/workflows/inspect-mobile-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download and decode official APK
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o base.apk 'https://github.com/redphx/better-xcloud-android/releases/download/a0.24.2/com.redphx.betterxc_0.24.2-39.apk'
          curl -L --fail --retry 3 -o apktool.jar 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar'
          java -jar apktool.jar d -f base.apk -o decoded

      - name: Locate scripts and loader
        shell: bash
        run: |
          set -u
          {
            echo '=== ASSETS / UNKNOWN / RAW ==='
            find decoded/assets decoded/unknown decoded/res/raw -type f 2>/dev/null | sort || true
            echo
            echo '=== FILES NAMED SCRIPT/JS/USER ==='
            find decoded -type f \( -iname '*script*' -o -iname '*.js' -o -iname '*user*' -o -iname '*bundle*' \) -print 2>/dev/null | sort | head -n 1000 || true
            echo
            echo '=== FILES WITH BETTER XCLOUD MARKERS ==='
            grep -RIlEa 'Better Xcloud|Better xCloud|BetterXcloud|better-xcloud.user.js|redphx' decoded/assets decoded/unknown decoded/res 2>/dev/null | head -n 500 || true
            echo
            echo '=== SMALI ASSET/WEBVIEW REFERENCES ==='
            grep -RniE 'bundled|script|getAssets|AssetManager|evaluateJavascript|evaluate_javascript|javascript:|loadUrl|load_url|addJavascriptInterface|WebView|webview|better-xcloud.user.js|githubusercontent' decoded/smali*/com/redphx/better_xcloud 2>/dev/null | head -n 2000 || true
            echo
            echo '=== APP SMALI FILES ==='
            find decoded/smali* -path '*/com/redphx/better_xcloud/*' -type f -print 2>/dev/null | sort || true
          } | tee focused-inspection.txt

      - name: Upload focused inspection
        uses: actions/upload-artifact@v4
        with:
          name: better-xcloud-mobile-focused-inspection
          path: focused-inspection.txt
          if-no-files-found: error
