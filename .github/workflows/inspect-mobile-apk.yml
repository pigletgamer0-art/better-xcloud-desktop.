name: Inspect Better xCloud Android APK

on:
  push:
    branches: [mobile-enhanced-v0.1]
    paths:
      - '.github/workflows/inspect-mobile-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download and decode official APK
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o base.apk 'https://github.com/redphx/better-xcloud-android/releases/download/a0.24.2/com.redphx.betterxc_0.24.2-39.apk'
          curl -L --fail --retry 3 -o apktool.jar 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar'
          java -jar apktool.jar d -f base.apk -o decoded

      - name: Inspect userscript injection
        shell: bash
        run: |
          set -u
          {
            echo '=== ADDITIONAL USER SCRIPT ==='
            file decoded/assets/userscripts/additional.user.js || true
            wc -c -l decoded/assets/userscripts/additional.user.js || true
            sed -n '1,360p' decoded/assets/userscripts/additional.user.js || true
            echo
            echo '=== USERSCRIPT UTIL ==='
            for f in decoded/smali*/com/redphx/betterxc/util/UserscriptUtil*.smali; do
              [ -f "$f" ] || continue
              echo "--- $f ---"
              grep -nE '^\.method|additional\.user\.js|userscripts|assets|AssetManager|evaluateJavascript|script|Better' "$f" | head -n 1200 || true
            done
            echo
            echo '=== UPDATE SCRIPT TASK ==='
            for f in decoded/smali*/com/redphx/betterxc/task/UpdateScriptTask*.smali; do
              [ -f "$f" ] || continue
              echo "--- $f ---"
              grep -nE '^\.method|github|raw|userscript|script|assets|better-xcloud' "$f" | head -n 1200 || true
            done
            echo
            echo '=== MAIN ACTIVITY / WEBVIEW REFERENCES ==='
            grep -RniE 'additional\.user\.js|userscripts|evaluateJavascript|evaluate_javascript|javascript:|loadUrl|load_url|WebView|webview|UserscriptUtil|script' decoded/smali*/com/redphx/betterxc 2>/dev/null | head -n 2500 || true
          } | tee injection-inspection.txt

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: better-xcloud-mobile-injection-inspection
          path: injection-inspection.txt
          if-no-files-found: error
