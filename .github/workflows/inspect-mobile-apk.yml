name: Inspect Better xCloud Android APK

on:
  push:
    branches: [mobile-enhanced-build]
    paths: ['.github/workflows/inspect-mobile-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download official APK
        run: |
          curl -L --fail -o app.apk 'https://github.com/redphx/better-xcloud-android/releases/download/a0.24.2/com.redphx.betterxc_0.24.2-39.apk'
          sha256sum app.apk
      - name: Install apktool
        run: |
          curl -L --fail -o apktool.jar 'https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar'
      - name: Decode APK
        run: |
          java -jar apktool.jar d -f app.apk -o decoded >/dev/null
          echo '=== assets/res/raw/lib ==='
          find decoded/assets decoded/res/raw decoded/lib -maxdepth 3 -type f 2>/dev/null | sort | head -n 500 || true
          echo '=== package smali dirs ==='
          find decoded -type d -path '*redphx*' | head -n 100 || true
      - name: Find script and WebView hooks
        run: |
          echo '=== interesting smali files ==='
          grep -RIlE 'evaluateJavascript|loadUrl|addJavascriptInterface|WebViewClient|userscript|custom.?script|better.?xcloud' decoded/smali* 2>/dev/null | head -n 100 || true
          echo '=== matching lines ==='
          grep -RInE 'evaluateJavascript|addJavascriptInterface|userscript|custom.?script|better.?xcloud|javascript:' decoded/smali* 2>/dev/null | head -n 500 || true
          echo '=== asset names ==='
          find decoded/assets -type f -maxdepth 5 2>/dev/null -print | head -n 400 || true
      - name: Manifest
        run: |
          sed -n '1,260p' decoded/AndroidManifest.xml
